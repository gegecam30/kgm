name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js Static Export
        run: npm run build
      # La vista previa de las ramas "mejora/**" vive en gh-pages/preview (ver preview.yml).
      # Pages publica desde Actions, así que se incluye en el mismo artefacto: /kgm/preview/
      - name: Checkout de gh-pages (vista previa)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Incluir la vista previa
        run: |
          if [ -d gh-pages/preview ]; then
            cp -r gh-pages/preview out/preview
          else
            echo "Sin vista previa en gh-pages."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
